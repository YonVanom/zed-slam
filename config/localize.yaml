/**:
  ros__parameters:
    # Camera Settings
    fps: 60
    resolution: "HD1080"  # Options: HD2K, HD1080, SVGA
    depth_mode: "NEURAL_LIGHT"  # Options: NEURAL, NEURAL_LIGHT, NEURAL_PLUS

    # Map / Area File
    area_file: "/home/autoware/zed_slam/src/zed-slam/data/maps/moore_manual_3.area"

    # Mapping Mode
    # initial_mapping: true  -> build a brand-new map
    # initial_mapping: false -> localize on (or update) an existing map
    initial_mapping: false

    # update_map: true  -> lifetime mapping (append to existing map)
    # update_map: false -> pure localization (read-only)
    update_map: false

    enable_localization_only : false

    # Sensor data publishing (disabled by default — high bandwidth)
    publish_image: false
    publish_pointcloud: false
    publish_depth: false
    pointcloud_rate: 5.0    # Hz; point cloud runs in its own thread at this rate
    pointcloud_width: 448   # COMPACT = NEURAL_W/2 (default in zed-ros2-wrapper)
    pointcloud_height: 256  # COMPACT = NEURAL_H/2

    # 2D mode: constrain tracking to XY ground plane (enable_2d_ground_mode in ZED SDK)
    enable_2d_mode: false
